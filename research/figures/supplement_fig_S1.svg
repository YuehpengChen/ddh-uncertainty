 <title>Figure S1 geometry</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Figure S1 geometry</dc:title>
    <dc:description>Fig. S1. Analytical geometry of coordinate and angle changes. (A) P1–P2 defines the baseline; P4–P3 and P4–P5 define alpha and beta. P4 lies on the baseline only for schematic simplicity. (B) Moving one endpoint 8 pixels perpendicular to an original segment of length 40 or 80 pixels changes its direction by arctan(8/L), giving 11.31° or 5.71°. Solid and dashed segments denote the original and displaced configurations. (C) Shared translation of all five landmarks preserves both angles. These analytical schematics explain geometric sensitivity; they are not clinical observations.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Matplotlib v3.10.6, https://matplotlib.org/</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
